# ============================================================================
# GitHub Actions pipeline — deploy an Azure Migrate project via Bicep.
#
# Auth: OIDC federated credentials (preferred — no long-lived secret).
#   Set repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   and configure a federated credential on the SP for this repo/branch.
#
# Fallback auth (prototype): a single AZURE_CREDENTIALS secret holding the
#   `az ad sp create-for-rbac --json-auth` output. See the commented block.
# ============================================================================
name: Deploy Azure Migrate Project

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which params file to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev]
      resourceGroup:
        description: 'Target resource group'
        required: true
        default: 'rg-migrate-dev'
      projectName:
        description: 'Migrate project name (must be UNIQUE within the subscription)'
        required: true
        default: 'migrate-dev-workload01'
      custodianTeam:
        description: 'Custodian team / workload owner (for tagging + audit)'
        required: true
        default: 'platform-migrations'
      prepareApplianceIdentity:
        description: 'Also pre-create the appliance Entra app + certificate (preconfigured-app registration)'
        required: true
        default: true
        type: boolean
      applianceName:
        description: 'Appliance name (UNIQUE per appliance — one app registration each). Only used if prepareApplianceIdentity is true.'
        required: false
        default: 'appliance01'

permissions:
  id-token: write        # required for OIDC login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # --- OIDC login (preferred) -------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Fallback: SP secret (uncomment to use instead of OIDC) -----------
      # - name: Azure login (SP secret)
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        id: deploy
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh \
            "${{ inputs.resourceGroup }}" \
            "environments/${{ inputs.environment }}.params.json" \
            "australiaeast" \
            "projectName=${{ inputs.projectName }}" \
            "custodianTeam=${{ inputs.custodianTeam }}"
          # Surface the Key Vault name (a deployment output) for the next step.
          KV_NAME=$(az deployment group show \
            --resource-group "${{ inputs.resourceGroup }}" \
            --name main \
            --query "properties.outputs.keyVaultName.value" -o tsv)
          echo "keyVaultName=${KV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare appliance identity
        if: ${{ inputs.prepareApplianceIdentity }}
        run: |
          chmod +x scripts/prepare-appliance-identity.sh
          ./scripts/prepare-appliance-identity.sh \
            "${{ inputs.resourceGroup }}" \
            "${{ inputs.projectName }}" \
            "${{ inputs.applianceName }}" \
            "${{ steps.deploy.outputs.keyVaultName }}"
