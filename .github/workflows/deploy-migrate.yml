# ============================================================================
# GitHub Actions — PLATFORM SETUP: appliance support resources.
#
# The central Migrate project already exists (client platform / LZ build). Run
# ONCE (by the platform team) to add the appliance-certificate Key Vault (+ the
# pipeline SP's Certificates Officer role) into the existing project's RG, and
# optionally an AWS Recovery Services vault. Does NOT create the project, storage,
# networking, DNS, or the private endpoint. Custodian teams are onboarded
# separately — see onboard-team.yml.
#
# Auth: OIDC federated credentials — repo secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, with a federated credential on the SP
# for this repo's `platform` environment.
# ============================================================================
name: Platform Setup - Appliance Support Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment (drives the OIDC federated credential)'
        required: true
        default: 'platform'
        type: choice
        options: [platform]
      resourceGroup:
        description: 'Resource group of the EXISTING central Migrate project'
        required: true
        default: 'rg-migrate-platform'

permissions:
  id-token: write        # required for OIDC login
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy appliance support resources
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh \
            "${{ inputs.resourceGroup }}" \
            "environments/platform.params.json"
