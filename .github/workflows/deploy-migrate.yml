# ============================================================================
# GitHub Actions — PLATFORM BOOTSTRAP: deploy the central Azure Migrate project.
#
# Run ONCE (by the platform team) to stand up the shared central project +
# storage + Key Vault. Custodian teams are onboarded separately — see
# onboard-team.yml. Networking, DNS, and the project's private endpoint are
# provided by the client platform (out of scope here).
#
# Auth: OIDC federated credentials — repo secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, with a federated credential on the SP
# for this repo's `platform` environment.
# ============================================================================
name: Platform Bootstrap - Central Migrate Project

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment (drives the OIDC federated credential)'
        required: true
        default: 'platform'
        type: choice
        options: [platform]
      resourceGroup:
        description: 'Resource group for the central Migrate project'
        required: true
        default: 'rg-migrate-platform'

permissions:
  id-token: write        # required for OIDC login
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy central Migrate project
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh \
            "${{ inputs.resourceGroup }}" \
            "environments/platform.params.json"
